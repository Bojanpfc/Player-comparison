<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Comparison</title>
    <style>
:root {
    --bg-color: #050708;
    --card-bg: rgba(12,18,17,.92);
    --card-hover: rgba(17,28,25,.98);
    --accent-green: #00ff75;
    --accent-red: #ff4d67;
    --group-title-color: #8ea099;
    --border-glow: rgba(0,255,117,.35);
    --text-dim: #81908a;
    --text-main: #f5f7f6;
    --input-bg: rgba(9,15,13,.96);
    --row-bg: rgba(15,23,20,.9);
    --shadow-color: rgba(0,0,0,.55);
    --border-color: rgba(0,255,117,.15);
    --green-soft: rgba(0,255,117,.07);
}

[data-theme="light"] {
    --bg-color: #e8eeeb;
    --card-bg: #f5f8f6;
    --card-hover: #ffffff;
    --accent-green: #009e4b;
    --accent-red: #c62843;
    --group-title-color: #50605a;
    --border-glow: rgba(0,158,75,.25);
    --text-dim: #64736d;
    --text-main: #102019;
    --input-bg: #edf3ef;
    --row-bg: #e3ebe6;
    --shadow-color: rgba(0,0,0,.12);
    --border-color: rgba(0,100,50,.16);
}

* { box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
        radial-gradient(circle at 50% -5%, rgba(0,255,117,.10), transparent 30%),
        radial-gradient(circle at 100% 55%, rgba(0,255,117,.035), transparent 28%),
        var(--bg-color);
    color: var(--text-main);
    margin: 0;
    padding: 20px 14px 38px;
    min-height: 100vh;
    position: relative;
    transition: background .3s, color .3s;
}

body::before {
    content: "";
    position: fixed;
    width: 430px;
    height: 430px;
    top: -210px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,255,117,.06);
    filter: blur(100px);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
}

.app-content {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
}

/* Top navigation */
.header-container {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    width: 100%;
    margin: 0 auto 18px;
    min-height: 44px;
}

.header-container::before {
    content: "FC MOBILE HUB";
    position: absolute;
    left: 0;
    top: -3px;
    color: var(--accent-green);
    font-size: 10px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 1px;
}

h2 {
    margin: 0;
    color: var(--text-main);
    font-size: 18px;
    font-weight: 800;
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: .8px;
    text-align: center;
}

h2::after {
    content: "";
    display: block;
    width: 38px;
    height: 2px;
    margin: 6px auto 0;
    background: var(--accent-green);
    box-shadow: 0 0 12px rgba(0,255,117,.35);
}

.back-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: linear-gradient(100deg, rgba(13,34,24,.95), rgba(8,14,12,.95));
    color: var(--text-main);
    padding: 8px 12px;
    border-radius: 9px;
    text-decoration: none;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 13px;
    border: 1px solid var(--border-color);
    transition: .2s ease;
}

.back-btn:hover {
    border-color: rgba(0,255,117,.5);
    color: var(--accent-green);
    transform: translateX(-2px);
}

.theme-toggle {
    position: absolute;
    right: 0;
    top: 0;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    width: 34px;
    height: 34px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 18px var(--shadow-color);
    transition: .2s ease;
}

.theme-toggle:hover {
    color: var(--accent-green);
    border-color: rgba(0,255,117,.5);
}

/* Tabs */
.tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 12px;
}

.tab-btn {
    background: var(--card-bg);
    color: var(--text-dim);
    border: 1px solid var(--border-color);
    padding: 9px 8px;
    border-radius: 9px;
    font-weight: 800;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: .8px;
    transition: .2s ease;
}

.tab-btn:hover {
    color: var(--text-main);
    border-color: rgba(0,255,117,.35);
}

.tab-btn.active {
    background: linear-gradient(100deg, rgba(0,255,117,.18), rgba(0,255,117,.07));
    color: var(--accent-green);
    border-color: rgba(0,255,117,.55);
    box-shadow: 0 0 18px rgba(0,255,117,.07), inset 0 0 15px rgba(0,255,117,.035);
}

/* Player controls */
.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
    margin: 0 auto 13px;
}

.player-selector-group {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 5px;
    position: relative;
    min-width: 0;
}

.search-box { position: relative; width: 100%; }

.search-input {
    width: 100%;
    padding: 10px 31px 10px 11px;
    background: var(--card-bg);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 9px;
    font-weight: 600;
    outline: none;
    font-size: 11px;
    transition: .2s ease;
}

.search-input::placeholder { color: var(--text-dim); }

.search-input:focus {
    border-color: rgba(0,255,117,.55);
    box-shadow: 0 0 16px rgba(0,255,117,.08);
}

.search-icon {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent-green);
    pointer-events: none;
    font-size: 11px;
}

.custom-dropdown-container { position: relative; width: 100%; }

.custom-select-btn {
    width: 100%;
    padding: 9px 10px;
    background: var(--input-bg);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 9px;
    font-weight: 700;
    outline: none;
    font-size: 10px;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: .2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.custom-select-btn:hover {
    border-color: rgba(0,255,117,.4);
}

.custom-select-btn::after {
    content: "⌄";
    font-size: 12px;
    color: var(--accent-green);
    margin-left: 5px;
    flex-shrink: 0;
}

.custom-dropdown-list,
.dropdown-list {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #09100d;
    border: 1px solid rgba(0,255,117,.2);
    border-radius: 9px;
    max-height: 210px;
    overflow-y: auto;
    z-index: 200;
    display: none;
    box-shadow: 0 14px 35px rgba(0,0,0,.65);
}

.custom-dropdown-item,
.dropdown-item {
    padding: 9px 10px;
    cursor: pointer;
    font-size: 11px;
    border-bottom: 1px solid rgba(255,255,255,.05);
    color: var(--text-main);
    font-weight: 600;
    transition: .15s ease;
}

.custom-dropdown-item:last-child,
.dropdown-item:last-child { border-bottom: none; }

.custom-dropdown-item:hover,
.dropdown-item:hover {
    background: rgba(0,255,117,.12);
    color: var(--accent-green);
}

.dropdown-item {
    display: flex;
    justify-content: space-between;
}

.dropdown-item .pos-tag {
    color: var(--accent-green);
    font-size: 9px;
}

/* Comparison cards */
.compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
    margin: 0 auto;
    align-items: start;
}

.player-card {
    background: linear-gradient(150deg, rgba(14,24,20,.96), rgba(7,12,10,.96));
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 7px;
    box-shadow: 0 9px 28px var(--shadow-color), inset 0 1px 0 rgba(255,255,255,.025);
    min-width: 0;
    position: relative;
    overflow: hidden;
}

.player-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 14px;
    right: 14px;
    height: 2px;
    background: var(--accent-green);
    opacity: .65;
    box-shadow: 0 0 12px rgba(0,255,117,.25);
}

.player-header {
    border-bottom: 1px solid rgba(0,255,117,.11);
    padding: 4px 2px 8px;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.player-top-row {
    display: flex;
    align-items: center;
    gap: 7px;
}

.player-img {
    width: 66px;
    height: 78px;
    object-fit: contain;
    flex-shrink: 0;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,.45));
}

.player-details-right {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 9px;
    color: var(--text-dim);
    font-weight: 700;
    flex-grow: 1;
}

.meta-line { display: flex; align-items: center; gap: 4px; }

.player-bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 5px;
    margin-top: 2px;
    padding-top: 6px;
    border-top: 1px dashed rgba(255,255,255,.07);
}

.player-name-area {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
    flex-grow: 1;
}

.player-name {
    font-size: 10px;
    font-weight: 850;
    color: var(--text-main);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-wr { font-size: 8.5px; color: var(--text-dim); font-weight: 600; }

.pros-cons-btn {
    background: none;
    border: none;
    color: var(--accent-green);
    font-size: 9px;
    font-weight: 800;
    cursor: pointer;
    padding: 1px 0;
    text-align: left;
    text-decoration: none;
    width: fit-content;
}

.pros-cons-btn:hover { text-decoration: underline; }

.shard-inline {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    color: #54c8ff;
    font-weight: 800;
    font-size: 9px;
    white-space: nowrap;
    flex-shrink: 0;
}

/* Stats */
.stat-group {
    margin-bottom: 7px;
    background: rgba(6,11,9,.72);
    padding: 5px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,.045);
}

.group-title {
    font-size: 8.5px;
    font-weight: 900;
    color: var(--accent-green);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 5px;
    padding-left: 2px;
}

.main-stats-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
    text-align: center;
}

.stat-box-main {
    display: flex;
    flex-direction: column;
    padding: 3px 0;
    border-radius: 5px;
    justify-content: center;
    align-items: center;
    min-width: 0;
}

.stat-box-main .lbl {
    font-size: 6px;
    color: var(--text-dim);
    font-weight: 800;
    margin-bottom: 2px;
}

.stat-box-main .val {
    font-size: 9px;
    font-weight: 900;
    padding: 2px 3px;
    border-radius: 4px;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--row-bg);
    padding: 4px 6px;
    border-radius: 5px;
    margin-bottom: 2px;
    font-size: 9px;
    min-height: 23px;
}

.stat-row:last-child { margin-bottom: 0; }

.stat-row .name {
    color: var(--text-main);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-right: 3px;
}

.stat-row .val-box {
    padding: 2px 5px;
    border-radius: 4px;
    font-weight: 900;
    min-width: 21px;
    text-align: center;
    flex-shrink: 0;
}

.better {
    background: rgba(0,230,118,.20);
    color: #fff !important;
    border: 1px solid rgba(0,230,118,.42);
}

.better-highlight {
    background: rgba(0,230,118,.38);
    color: #fff !important;
    border: 1px solid rgba(0,230,118,.85);
    box-shadow: 0 0 8px rgba(0,230,118,.18);
    font-weight: 900;
}

.worse {
    background: rgba(255,61,87,.18);
    color: #fff !important;
    border: 1px solid rgba(255,61,87,.40);
}

.equal {
    background: rgba(255,255,255,.06);
    color: var(--text-main);
    border: 1px solid rgba(255,255,255,.07);
}

/* Modal */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 16px;
}

.modal-content {
    background: linear-gradient(150deg, #101a16, #070c0a);
    border: 1px solid rgba(0,255,117,.25);
    border-radius: 13px;
    width: 100%;
    max-width: 360px;
    padding: 17px;
    box-shadow: 0 18px 50px rgba(0,0,0,.7), 0 0 25px rgba(0,255,117,.06);
    position: relative;
    animation: modalFadeIn .2s ease-out;
}

@keyframes modalFadeIn {
    from { opacity: 0; transform: scale(.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 7px;
    color: var(--text-dim);
    width: 27px;
    height: 27px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.modal-close:hover { color: var(--accent-green); }

.modal-title {
    font-size: 14px;
    font-weight: 900;
    font-style: italic;
    color: var(--text-main);
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(0,255,117,.12);
    padding-bottom: 8px;
    padding-right: 32px;
}

.modal-section-title {
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
    margin-top: 10px;
    margin-bottom: 6px;
    letter-spacing: .8px;
}

.modal-section-title.pros { color: var(--accent-green); }
.modal-section-title.cons { color: var(--accent-red); }

.modal-list {
    list-style: none;
    padding: 0;
    margin: 0 0 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.modal-list li {
    font-size: 11px;
    color: var(--text-main);
    display: flex;
    align-items: flex-start;
    gap: 6px;
    line-height: 1.3;
}

.modal-list.pros-list li::before { content: "+"; color: var(--accent-green); font-weight: 900; }
.modal-list.cons-list li::before { content: "-"; color: var(--accent-red); font-weight: 900; }

.modal-worth-box {
    margin-top: 12px;
    padding-top: 9px;
    border-top: 1px dashed rgba(255,255,255,.08);
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
}

.worth-yes { color: var(--accent-green); font-weight: 900; }
.worth-no { color: var(--accent-red); font-weight: 900; }

.modal-disclaimer {
    margin-top: 10px;
    font-size: 9px;
    color: var(--text-dim);
    text-align: center;
    font-style: italic;
    border-top: 1px solid rgba(255,255,255,.06);
    padding-top: 7px;
}

@media (max-width: 390px) {
    body { padding: 16px 11px 30px; }
    .app-content { max-width: 100%; }
    .header-container { margin-bottom: 15px; }
    .header-container::before { font-size: 8px; }
    h2 { font-size: 16px; }
    .controls { gap: 6px; }
    .compare-grid { gap: 6px; }
    .player-card { padding: 6px; }
    .player-img { width: 58px; height: 70px; }
    .stat-row { font-size: 8.5px; }
}
</style>
</head>
<body>

    <div class="bg-logo-container">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>

    <div class="app-content">
        <!-- Back dugme -->
        <a href="index.html" class="back-btn">&#8592; Back</a>

        <div class="header-container">
            <h2>Player Comparison</h2>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeIcon">☀️</button>
        </div>

        <div class="tabs">
            <button class="tab-btn" id="btn-DEF" onclick="switchTab('DEF', this, true)">DEF</button>
            <button class="tab-btn" id="btn-MID" onclick="switchTab('MID', this, true)">MID</button>
            <button class="tab-btn" id="btn-ATT" onclick="switchTab('ATT', this, true)">ATT</button>
        </div>

        <div class="controls">
            <!-- Player 1 Selector -->
            <div class="player-selector-group">
                <div class="search-box">
                    <input type="text" id="p1Input" class="search-input" placeholder="Player 1..." oninput="filterPlayers(1)" onfocus="showList(1)">
                    <span class="search-icon">&#128269;</span>
                    <div id="p1List" class="dropdown-list"></div>
                </div>
                <div class="custom-dropdown-container">
                    <button type="button" class="custom-select-btn" id="p1CustomBtn" onclick="toggleCustomDropdown(1)">Select player...</button>
                    <div id="p1CustomList" class="custom-dropdown-list"></div>
                </div>
            </div>

            <!-- Player 2 Selector -->
            <div class="player-selector-group">
                <div class="search-box">
                    <input type="text" id="p2Input" class="search-input" placeholder="Player 2..." oninput="filterPlayers(2)" onfocus="showList(2)">
                    <span class="search-icon">&#128269;</span>
                    <div id="p2List" class="dropdown-list"></div>
                </div>
                <div class="custom-dropdown-container">
                    <button type="button" class="custom-select-btn" id="p2CustomBtn" onclick="toggleCustomDropdown(2)">Select player...</button>
                    <div id="p2CustomList" class="custom-dropdown-list"></div>
                </div>
            </div>
        </div>

        <div class="compare-grid">
            <div class="player-card" id="card1"></div>
            <div class="player-card" id="card2"></div>
        </div>
    </div>

    <!-- POPUP MODAL -->
    <div class="modal-overlay" id="infoModal" onclick="closeModalOnBg(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-title" id="modalPlayerTitle">Player Info</div>
            
            <div class="modal-section-title pros">Pros</div>
            <ul class="modal-list pros-list" id="modalProsList"></ul>

            <div class="modal-section-title cons">Cons</div>
            <ul class="modal-list cons-list" id="modalConsList"></ul>

            <div class="modal-worth-box">
                <span>Worth the shard cost:</span>
                <span id="modalWorthVal">-</span>
            </div>

            <div class="modal-disclaimer">
                Based on personal opinion, subject to change.
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '14GJlmnduoo0s8-p5olA1qzmX6a0ylmoVBTshTxeEA3A';
        
        let currentTab = localStorage.getItem('fc_comparison_tab') || 'DEF';
        let playersData = [];
        let headers = [];

        let savedP1 = localStorage.getItem('fc_comparison_p1');
        let savedP2 = localStorage.getItem('fc_comparison_p2');
        let selectedP1Idx = savedP1 !== null ? parseInt(savedP1) : 0;
        let selectedP2Idx = savedP2 !== null ? parseInt(savedP2) : 1;

        const statGroups = [
            { name: "Pace", keys: ["Acceleration", "Sprint speed"] },
            { name: "Shooting", keys: ["Finishing", "Shot power", "Long shots", "Positioning", "Volleys", "Penalties"] },
            { name: "Passing", keys: ["Short passing", "Long passing", "Vision", "Crossing", "Curve", "Free kick"] },
            { name: "Dribbling", keys: ["Dribbling", "Agility", "Balance", "Reactions", "Ball control"] },
            { name: "Defending", keys: ["Marking", "Standing tackle", "Sliding tackle", "Awareness", "Heading", "Interceptions"] },
            { name: "Physical", keys: ["Strength", "Aggression", "Jumping", "Stamina"] }
        ];

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const iconBtn = document.getElementById('themeIcon');

            if (currentTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
                iconBtn.textContent = '☀️';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                iconBtn.textContent = '🌙';
            }
        }

        function getProp(obj, keys) {
            for (let k of keys) {
                let foundKey = Object.keys(obj).find(key => key.toLowerCase().trim() === k.toLowerCase().trim());
                if (foundKey && obj[foundKey] !== undefined && obj[foundKey] !== '') return obj[foundKey];
            }
            return '-';
        }

        async function switchTab(tabName, btn, isManualClick = false) {
            currentTab = tabName;
            localStorage.setItem('fc_comparison_tab', tabName);

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) {
                btn.classList.add('active');
            } else {
                const targetBtn = document.getElementById(`btn-${tabName}`);
                if (targetBtn) targetBtn.classList.add('active');
            }

            await loadSheetData(isManualClick); 
        }

        async function loadSheetData(isTabSwitch = false) {
            try {
                const JSON_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${currentTab}`;
                const res = await fetch(JSON_URL);
                const text = await res.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));

                headers = json.table.cols.map(col => col ? col.label : '');
                let rawPlayers = json.table.rows.map(row => {
                    let player = {};
                    row.c.forEach((cell, idx) => {
                        if (headers[idx]) {
                            player[headers[idx]] = cell ? (cell.v !== null ? cell.v : '') : '';
                        }
                    });
                    return player;
                });

                // Sortiranje igrača od najvećeg ka najmanjem OVR-u
                playersData = rawPlayers.sort((a, b) => {
                    let ovrA = parseFloat(getProp(a, ['Ovr', 'OVR'])) || 0;
                    let ovrB = parseFloat(getProp(b, ['Ovr', 'OVR'])) || 0;
                    if (ovrB !== ovrA) {
                        return ovrB - ovrA; // Opadajuće po OVR
                    }
                    let nameA = String(getProp(a, ['Name', 'Ime'])).toLowerCase();
                    let nameB = String(getProp(b, ['Name', 'Ime'])).toLowerCase();
                    return nameA.localeCompare(nameB);
                });

                if (playersData.length > 0) {
                    if (isTabSwitch || isNaN(selectedP1Idx) || selectedP1Idx >= playersData.length) {
                        selectedP1Idx = playersData.length >= 2 ? 0 : 0;
                        selectedP2Idx = playersData.length >= 2 ? 1 : 0;
                        saveSelection();
                    } else {
                        if (selectedP2Idx >= playersData.length) selectedP2Idx = playersData.length > 1 ? 1 : 0;
                    }
                    
                    populateCustomDropdowns();
                    syncSelectors(1);
                    syncSelectors(2);
                    renderComparison();
                }
            } catch (err) {
                console.error("Error loading data:", err);
            }
        }

        function saveSelection() {
            localStorage.setItem('fc_comparison_p1', selectedP1Idx);
            localStorage.setItem('fc_comparison_p2', selectedP2Idx);
        }

        function populateCustomDropdowns() {
            const list1 = document.getElementById('p1CustomList');
            const list2 = document.getElementById('p2CustomList');
            list1.innerHTML = '';
            list2.innerHTML = '';

            playersData.forEach((player, idx) => {
                const name = getProp(player, ['Name', 'Ime']);
                const ovr = getProp(player, ['Ovr', 'OVR']);
                const optText = `${ovr} | ${name}`;

                const item1 = document.createElement('div');
                item1.className = 'custom-dropdown-item';
                item1.textContent = optText;
                item1.onclick = () => selectCustomPlayer(1, idx);
                list1.appendChild(item1);

                const item2 = document.createElement('div');
                item2.className = 'custom-dropdown-item';
                item2.textContent = optText;
                item2.onclick = () => selectCustomPlayer(2, idx);
                list2.appendChild(item2);
            });
            updateCustomButtonText(1);
            updateCustomButtonText(2);
        }

        function toggleCustomDropdown(slot) {
            const list = document.getElementById(`p${slot}CustomList`);
            const otherSlot = slot === 1 ? 2 : 1;
            document.getElementById(`p${otherSlot}CustomList`).style.display = 'none';
            document.getElementById(`p${otherSlot}List`).style.display = 'none';

            list.style.display = list.style.display === 'block' ? 'none' : 'block';
        }

        function updateCustomButtonText(slot) {
            const idx = slot === 1 ? selectedP1Idx : selectedP2Idx;
            const btn = document.getElementById(`p${slot}CustomBtn`);
            if (playersData[idx]) {
                const name = getProp(playersData[idx], ['Name', 'Ime']);
                const ovr = getProp(playersData[idx], ['Ovr', 'OVR']);
                btn.textContent = `${ovr} | ${name}`;
            }
        }

        function selectCustomPlayer(slot, idx) {
            if (slot === 1) {
                selectedP1Idx = idx;
            } else {
                selectedP2Idx = idx;
            }
            saveSelection();
            updateCustomButtonText(slot);
            document.getElementById(`p${slot}CustomList`).style.display = 'none';
            renderComparison();
        }

        function syncSelectors(slot) {
            const input = document.getElementById(`p${slot}Input`);
            input.value = '';
            updateCustomButtonText(slot);
        }

        function filterPlayers(slot) {
            const query = document.getElementById(`p${slot}Input`).value.toLowerCase();
            const listDiv = document.getElementById(`p${slot}List`);
            listDiv.innerHTML = '';
            document.getElementById(`p${slot}CustomList`).style.display = 'none';

            if (query.trim() === '') {
                listDiv.style.display = 'none';
                return;
            }

            listDiv.style.display = 'block';

            playersData.forEach((player, idx) => {
                const name = getProp(player, ['Name', 'Ime']);
                const ovr = getProp(player, ['Ovr', 'OVR']);
                const pos = getProp(player, ['Pos']);
                const fullText = `${ovr} ${name} ${pos}`.toLowerCase();

                if (fullText.includes(query)) {
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';
                    item.innerHTML = `<span><strong>${ovr}</strong> ${name}</span> <span class="pos-tag">${pos}</span>`;
                    item.onclick = () => selectPlayer(slot, idx);
                    listDiv.appendChild(item);
                }
            });
        }

        function showList(slot) {
            document.getElementById(`p${slot}CustomList`).style.display = 'none';
            if (document.getElementById(`p${slot}Input`).value.trim() !== '') {
                filterPlayers(slot);
            }
        }

        function selectPlayer(slot, idx) {
            if (slot === 1) {
                selectedP1Idx = idx;
            } else {
                selectedP2Idx = idx;
            }
            saveSelection();
            syncSelectors(slot);
            document.getElementById(`p${slot}List`).style.display = 'none';
            renderComparison();
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box') && !e.target.closest('.custom-dropdown-container')) {
                document.getElementById('p1List').style.display = 'none';
                document.getElementById('p2List').style.display = 'none';
                document.getElementById('p1CustomList').style.display = 'none';
                document.getElementById('p2CustomList').style.display = 'none';
            }
        });

        function renderComparison() {
            if (!playersData[selectedP1Idx] || !playersData[selectedP2Idx]) return;

            const p1 = playersData[selectedP1Idx];
            const p2 = playersData[selectedP2Idx];

            document.getElementById('card1').innerHTML = buildCardHTML(p1, p2, selectedP1Idx);
            document.getElementById('card2').innerHTML = buildCardHTML(p2, p1, selectedP2Idx);
        }

        function buildCardHTML(player, opponent, playerIdx) {
            const name = getProp(player, ['Name', 'Ime']);
            const ovr = getProp(player, ['Ovr', 'OVR']);
            const pos = getProp(player, ['Pos']);
            
            const altPos = getProp(player, ['Alt Pos', 'Alt Position', 'Alternative Position', 'AltPos']);
            const wf = getProp(player, ['WF', 'Weak Foot']);
            const sm = getProp(player, ['SM', 'Skill Moves']);
            const height = getProp(player, ['Height', 'Visina', 'Ht']);
            const imgUrl = getProp(player, ['Image', 'Img']);
            const shardCost = getProp(player, ['Shard cost', 'Shard Cost', 'ShardCost', 'Shards']);
            const wr = getProp(player, ['WR', 'Work Rate', 'Workrate']);

            let imgHTML = imgUrl !== '-' ? `<img src="${imgUrl}" class="player-img" alt="${name}" />` : '';
            let altPosText = (altPos !== '-' && altPos !== '') ? `Alt: ${altPos}` : '';
            let heightText = (height !== '-' && height !== '') ? `${height}` : '';
            let wrText = (wr !== '-' && wr !== '') ? `WR: ${wr}` : '';

            let shardHTML = '';
            if (shardCost !== '-' && shardCost !== '') {
                const formattedCost = typeof shardCost === 'number' ? shardCost.toLocaleString() : shardCost;
                shardHTML = `<span class="shard-inline"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46.21 14.25 0 14 0h-4c-.25 0-.46.21-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.22.24.42.49.42h4c.25 0 .46-.21.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65z"/><circle cx="12" cy="12" r="3"/></svg>${formattedCost}</span>`;
            }

            let html = `
                <div class="player-header">
                    <div class="player-top-row">
                        ${imgHTML}
                        <div class="player-details-right">
                            <div class="meta-line">WF: ${wf}★</div>
                            <div class="meta-line">SM: ${sm}★</div>
                            ${heightText ? `<div class="meta-line">Height: ${heightText}</div>` : ''}
                            ${altPosText ? `<div class="meta-line">${altPosText}</div>` : ''}
                        </div>
                    </div>
                    <div class="player-bottom-row">
                        <div class="player-name-area">
                            <div class="player-name">${ovr} | ${name} (${pos !== '-' ? pos : ''})</div>
                            ${wrText ? `<div class="player-wr">${wrText}</div>` : ''}
                            <button class="pros-cons-btn" onclick="openModal('${selectedP1Idx === playerIdx ? 'p1' : 'p2'}', '${name.replace(/'/g, "\\'")}')">Pros & Cons</button>
                        </div>
                        ${shardHTML}
                    </div>
                </div>
            `;

            html += `
                <div class="stat-group">
                    <div class="group-title">Overview</div>
                    <div class="main-stats-grid">
            `;

            ['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY'].forEach(key => {
                const val1Raw = getProp(player, [key]);
                const val2Raw = getProp(opponent, [key]);

                const val1 = parseFloat(val1Raw) || 0;
                const val2 = parseFloat(val2Raw) || 0;
                
                let cls = '';
                if (val1 > val2) {
                    cls = (val1 - val2 > 5) ? 'better-highlight' : 'better';
                } else if (val1 < val2) {
                    cls = 'worse';
                }

                html += `
                    <div class="stat-box-main">
                        <span class="lbl">${key}</span>
                        <span class="val ${cls}">${val1Raw}</span>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            statGroups.forEach(group => {
                let groupRowsHTML = '';

                group.keys.forEach(key => {
                    const matchedHeader = headers.find(h => h && h.trim().toLowerCase() === key.toLowerCase());

                    if (matchedHeader) {
                        const val1 = player[matchedHeader];
                        const val2 = opponent[matchedHeader];

                        const hasVal1 = val1 !== undefined && val1 !== '';
                        const hasVal2 = val2 !== undefined && val2 !== '';

                        if (hasVal1 || hasVal2) {
                            const num1 = parseFloat(val1);
                            const num2 = parseFloat(val2);

                            let cls = 'equal';
                            if (hasVal1 && hasVal2 && !isNaN(num1) && !isNaN(num2)) {
                                if (num1 > num2) {
                                    cls = (num1 - num2 > 5) ? 'better-highlight' : 'better';
                                } else if (num1 < num2) {
                                    cls = 'worse';
                                }
                            } else if (hasVal1 && !hasVal2) {
                                cls = 'better';
                            } else if (!hasVal1 && hasVal2) {
                                cls = 'worse';
                            }

                            groupRowsHTML += `
                                <div class="stat-row">
                                    <span class="name">${key}</span>
                                    <span class="val-box ${cls}">${hasVal1 ? val1 : '-'}</span>
                                </div>
                            `;
                        }
                    }
                });

                if (groupRowsHTML !== '') {
                    html += `
                        <div class="stat-group">
                            <div class="group-title">${group.name}</div>
                            ${groupRowsHTML}
                        </div>
                    `;
                }
            });

            return html;
        }

        function openModal(cardType, playerName) {
            const modal = document.getElementById('infoModal');
            const titleEl = document.getElementById('modalPlayerTitle');
            const prosListEl = document.getElementById('modalProsList');
            const consListEl = document.getElementById('modalConsList');
            const worthValEl = document.getElementById('modalWorthVal');

            const playerIdx = (cardType === 'p1') ? selectedP1Idx : selectedP2Idx;
            const player = playersData[playerIdx];

            titleEl.textContent = playerName + ' - Review';
            prosListEl.innerHTML = '';
            consListEl.innerHTML = '';
            worthValEl.textContent = '-';
            worthValEl.className = '';

            if (player) {
                const prosVal = getProp(player, ['Pros', 'Prednosti']);
                const consVal = getProp(player, ['Cons', 'Mane']);
                const worthVal = getProp(player, ['Worth shard cost', 'Worth Shard Cost', 'Shard Cost', 'Worth']);

                if (prosVal && prosVal !== '-') {
                    prosVal.split(',').forEach(item => {
                        const trimmed = item.trim();
                        if (trimmed) {
                            const li = document.createElement('li');
                            li.textContent = trimmed;
                            prosListEl.appendChild(li);
                        }
                    });
                }

                if (consVal && consVal !== '-') {
                    consVal.split(',').forEach(item => {
                        const trimmed = item.trim();
                        if (trimmed) {
                            const li = document.createElement('li');
                            li.textContent = trimmed;
                            consListEl.appendChild(li);
                        }
                    });
                }

                if (worthVal && worthVal !== '-') {
                    worthValEl.textContent = worthVal;
                    if (worthVal.toLowerCase() === 'yes') worthValEl.className = 'worth-yes';
                    else if (worthVal.toLowerCase() === 'no') worthValEl.className = 'worth-no';
                }
            }

            if (prosListEl.children.length === 0) {
                const li = document.createElement('li');
                li.textContent = 'No data available.';
                prosListEl.appendChild(li);
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        function closeModalOnBg(e) {
            if (e.target.id === 'infoModal') {
                closeModal();
            }
        }

        const initialBtn = document.getElementById(`btn-${currentTab}`);
        if (initialBtn) initialBtn.classList.add('active');
        loadSheetData(false);
    </script>
</body>
</html>
