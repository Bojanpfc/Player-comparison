<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champions Event</title>
    <style>
        :root {
            --card-bg: rgba(18, 24, 36, 0.90);
            --accent-blue: #3388ff;
            --text-main: #ffffff;
            --text-title: #ffffff;
        }
        body { 
            background-image: linear-gradient(rgba(11, 14, 20, 0.85), rgba(11, 14, 20, 0.85)), url('https://i.imgur.com/cjApIEw.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0b0e14; 
            color: var(--text-main); 
            font-family: sans-serif; 
            padding: 15px; 
            margin: 0; 
        }
        
        h1 { 
            color: var(--text-title); 
            text-align: center; 
            font-size: 1.2rem; 
            margin-bottom: 25px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .ovr-section { margin-bottom: 25px; max-width: 100%; }
        .ovr-header { 
            background: rgba(26, 35, 58, 0.9); 
            padding: 10px; 
            border-left: 4px solid #00ff88; 
            margin-bottom: 10px; 
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr) !important; 
            gap: 8px !important; 
            width: 100% !important;
        }

        .player-card { 
            background: var(--card-bg); 
            border: 1px solid rgba(26, 35, 58, 0.8);
            padding: 8px; 
            border-radius: 6px; 
            text-align: center; 
            min-width: 0; 
            backdrop-filter: blur(4px);
        }
        .player-card img { 
            width: 100% !important; 
            height: auto; 
            border-radius: 4px; 
            display: block;
        }
        .name { font-size: 0.75rem; font-weight: bold; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cost-text { color: var(--accent-blue); font-size: 0.7rem; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Worth taking with shards in this event</h1>
    <div id="content">Učitavam podatke...</div>

    <script>
        const SHEET_ID = '14GJlmnduoo0s8-p5olA1qzmX6a0ylmoVBTshTxeEA3A'; 
        const tabs = ['Def', 'Mid', 'Att']; 

        async function loadPlayers() {
            let players = [];
            for (const tab of tabs) {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${tab}&t=${Date.now()}`);
                const text = await res.text();
                const data = JSON.parse(text.substr(47).slice(0, -2));
                
                const cols = data.table.cols;
                let nI = -1, wI = -1, iI = -1, cI = -1, ovrI = -1;
                cols.forEach((col, idx) => {
                    const l = col.label?.trim().toLowerCase();
                    if (l === 'name') nI = idx;
                    if (l.includes('worth shard cost')) wI = idx;
                    if (l === 'image') iI = idx;
                    if (l.includes('shard cost')) cI = idx;
                    if (l === 'ovr') ovrI = idx;
                });

                data.table.rows.forEach(row => {
                    if (row.c[nI]?.v && row.c[wI]?.v?.toString().toLowerCase() === 'yes') {
                        players.push({
                            name: row.c[nI].v,
                            image: iI !== -1 ? row.c[iI].v : '',
                            cost: cI !== -1 ? row.c[cI].v : '0',
                            ovr: ovrI !== -1 ? row.c[ovrI].v : 'N/A',
                            numericCost: parseFloat(row.c[cI]?.v?.toString().replace(/[^0-9.]/g, '')) || 0
                        });
                    }
                });
            }

            const grouped = players.reduce((acc, p) => { (acc[p.ovr] = acc[p.ovr] || []).push(p); return acc; }, {});
            const sortedOvr = Object.keys(grouped).sort((a, b) => b - a);
            const container = document.getElementById('content');
            container.innerHTML = '';

            sortedOvr.forEach(ovr => {
                grouped[ovr].sort((a, b) => a.numericCost - b.numericCost);
                let html = `<div class="ovr-section"><div class="ovr-header">${ovr} OVR</div><div class="grid">`;
                grouped[ovr].forEach(p => {
                    html += `<div class="player-card"><img src="${p.image}"><div class="name">${p.name}</div><div class="cost-text">&#x1F9E9; ${p.cost}</div></div>`;
                });
                container.innerHTML += html + `</div></div>`;
            });
        }
        loadPlayers();
    </script>
</body>
</html>
