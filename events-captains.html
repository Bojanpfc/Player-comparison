<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captains Event</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #121824;
            --accent-green: #00ff88;
            --accent-blue: #3388ff;
            --text-main: #ffffff;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: sans-serif; 
            padding: 15px; 
            margin: 0; 
        }
        
        h1 { 
            color: var(--accent-green); 
            text-align: center; 
            font-size: 1.3rem; 
            margin-bottom: 25px; 
        }
        
        .ovr-section { 
            margin-bottom: 30px; 
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .ovr-header { 
            background: #1a233a; 
            padding: 10px 15px; 
            border-left: 4px solid var(--accent-green); 
            margin-bottom: 15px; 
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 4px;
        }

        /* Fiksiramo tačno 3 kolone sa jednakom širinom */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
        }

        .player-card { 
            background: var(--card-bg); 
            border: 1px solid #1a233a;
            padding: 10px; 
            border-radius: 8px; 
            text-align: center; 
            box-sizing: border-box;
        }
        .player-card img { 
            width: 100%; 
            height: auto; 
            border-radius: 6px; 
            margin-bottom: 6px;
        }
        .name { 
            font-size: 0.85rem; 
            font-weight: bold; 
            margin-bottom: 4px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .cost-text { 
            color: var(--accent-blue); 
            font-size: 0.75rem; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Players worth taking</h1>
    <div id="content">Loading...</div>

    <script>
        const SHEET_ID = '14GJlmnduoo0s8-p5olA1qzmX6a0ylmoVBTshTxeEA3A'; 
        const tabs = ['Def', 'Mid', 'Att']; 

        async function loadPlayers() {
            let players = [];

            for (const tab of tabs) {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${tab}`;
                const res = await fetch(url);
                const text = await res.text();
                const data = JSON.parse(text.substr(47).slice(0, -2));
                
                const cols = data.table.cols;
                let nI = -1, wI = -1, iI = -1, cI = -1, ovrI = -1;

                cols.forEach((col, idx) => {
                    const l = col.label?.trim().toLowerCase();
                    if (l === 'name') nI = idx;
                    if (l.includes('worth shard cost')) wI = idx;
                    if (l === 'image') iI = idx;
                    if (l.includes('shard cost')) cI = idx;
                    if (l === 'ovr') ovrI = idx;
                });

                data.table.rows.forEach(row => {
                    if (row.c[nI]?.v && row.c[wI]?.v?.toString().toLowerCase() === 'yes') {
                        players.push({
                            name: row.c[nI].v,
                            image: iI !== -1 ? row.c[iI].v : '',
                            cost: cI !== -1 ? row.c[cI].v : '0',
                            ovr: ovrI !== -1 ? row.c[ovrI].v : 'N/A',
                            numericCost: parseFloat(row.c[cI]?.v?.toString().replace(/[^0-9.]/g, '')) || 0
                        });
                    }
                });
            }

            const grouped = players.reduce((acc, p) => {
                (acc[p.ovr] = acc[p.ovr] || []).push(p);
                return acc;
            }, {});

            const sortedOvr = Object.keys(grouped).sort((a, b) => b - a);
            
            const container = document.getElementById('content');
            container.innerHTML = '';

            sortedOvr.forEach(ovr => {
                grouped[ovr].sort((a, b) => a.numericCost - b.numericCost);

                let html = `<div class="ovr-section">
                                <div class="ovr-header">${ovr} OVR</div>
                                <div class="grid">`;
                
                grouped[ovr].forEach(p => {
                    html += `
                        <div class="player-card">
                            <img src="${p.image}">
                            <div class="name">${p.name}</div>
                            <div class="cost-text">&#x1F9E9; ${p.cost}</div>
                        </div>`;
                });
                
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        loadPlayers();
    </script>
</body>
</html>
