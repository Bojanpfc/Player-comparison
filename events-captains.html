<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captains Event</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #121824;
            --accent-green: #00ff88;
            --accent-blue: #3388ff;
            --text-main: #ffffff;
            --text-dim: #8b9bb4;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: sans-serif; 
            padding: 15px; 
            margin: 0;
        }
        h1 { 
            color: var(--accent-green); 
            text-align: center; 
            font-size: 1.2rem; 
            margin-bottom: 20px; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* Dva igrača u redu na mobilnom, može i više na većim ekranima */
            gap: 12px; 
            max-width: 500px;
            margin: 0 auto;
        }
        @media (min-width: 500px) {
            .grid {
                grid-template-columns: repeat(3, 1fr); /* Tri u redu ako je malo veći ekran */
            }
        }
        .player-card { 
            background: var(--card-bg); 
            border: 1px solid #1a233a; 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center; 
        }
        .player-card img { 
            width: 100%; 
            height: auto;
            border-radius: 5px; 
            margin-bottom: 6px; 
        }
        .name { 
            font-weight: bold; 
            font-size: 0.9rem; 
            color: var(--text-main); 
            margin-bottom: 4px;
        }
        .cost-text { 
            color: var(--accent-blue); 
            font-size: 0.8rem; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <h1>Players worth taking in this event</h1>
    <div class="grid" id="playerList">Loading players...</div>

    <script>
        const SHEET_ID = '14GJlmnduoo0s8-p5olA1qzmX6a0ylmoVBTshTxeEA3A'; 
        const tabs = ['Def', 'Mid', 'Att']; 

        async function loadAllPlayers() {
            let allPlayers = [];

            for (const tab of tabs) {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${tab}`;
                
                try {
                    const res = await fetch(url);
                    const text = await res.text();
                    const data = JSON.parse(text.substr(47).slice(0, -2));
                    
                    const cols = data.table.cols;
                    let nameIdx = -1, eventIdx = -1, worthIdx = -1, imgIdx = -1, costIdx = -1;

                    cols.forEach((col, index) => {
                        if (!col || !col.label) return;
                        const label = col.label.trim().toLowerCase();
                        if (label === 'name') nameIdx = index;
                        if (label === 'event') eventIdx = index;
                        if (label.includes('worth shard cost')) worthIdx = index;
                        if (label === 'image') imgIdx = index;
                        if (label.includes('shard cost')) costIdx = index;
                    });

                    if (nameIdx !== -1 && worthIdx !== -1) {
                        data.table.rows.forEach(row => {
                            const name = row.c[nameIdx]?.v;
                            const worthCost = row.c[worthIdx]?.v;
                            const image = imgIdx !== -1 ? row.c[imgIdx]?.v : '';
                            const rawCost = costIdx !== -1 ? (row.c[costIdx]?.v || 0) : 0;

                            if (name && worthCost && worthCost.toString().trim().toLowerCase() === 'yes') {
                                // Čistimo cenu u broj radi sortiranja (uklanjamo tačke, zareze ako ih ima)
                                let numericCost = parseFloat(rawCost.toString().replace(/[^0-9.]/g, '')) || 0;
                                
                                allPlayers.push({
                                    name: name,
                                    image: image,
                                    costText: rawCost,
                                    numericCost: numericCost
                                });
                            }
                        });
                    }
                } catch (e) {
                    console.log("Greška pri učitavanju taba: " + tab);
                }
            }

            const container = document.getElementById('playerList');
            container.innerHTML = '';

            if (allPlayers.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#8b9bb4; grid-column:1/-1;">Nema igrača sa "Yes".</p>';
                return;
            }

            // SORTIRANJE: Od najjeftinijeg ka najskupljem
            allPlayers.sort((a, b) => a.numericCost - b.numericCost);

            // Prikazivanje na stranici
            allPlayers.forEach(player => {
                container.innerHTML += `
                    <div class="player-card">
                        <img src="${player.image}" alt="${player.name}">
                        <div class="name">${player.name}</div>
                        <div class="cost-text">&#x1F9E9; ${player.costText}</div>
                    </div>
                `;
            });
        }

        loadAllPlayers();
    </script>
</body>
</html>
