<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captains Event</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #121824;
            --accent-green: #00ff88;
            --text-main: #ffffff;
            --text-dim: #8b9bb4;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: sans-serif; 
            padding: 20px; 
            margin: 0;
        }
        h1 { 
            color: var(--accent-green); 
            text-align: center; 
            font-size: 1.3rem; 
            margin-bottom: 25px; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
            max-width: 600px;
            margin: 0 auto;
        }
        .player-card { 
            background: var(--card-bg); 
            border: 1px solid #1a233a; 
            padding: 12px; 
            border-radius: 10px; 
            text-align: center; 
        }
        .player-card img { 
            width: 100%; 
            height: auto;
            border-radius: 6px; 
            margin-bottom: 8px; 
        }
        .name { 
            font-weight: bold; 
            font-size: 0.95rem; 
            color: var(--text-main); 
            margin-bottom: 4px;
        }
        .worth-text { 
            color: var(--accent-green); 
            font-size: 0.8rem; 
            font-weight: 600; 
        }
    </style>
</head>
<body>

    <h1>Players worth taking in this event</h1>
    <div class="grid" id="playerList">Loading players...</div>

    <script>
        const SHEET_ID = '14GJlmnduoo0s8-p5olA1qzmX6a0ylmoVBTshTxeEA3A'; 
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Mid`;

        fetch(url).then(res => res.text()).then(text => {
            const data = JSON.parse(text.substr(47).slice(0, -2));
            const container = document.getElementById('playerList');
            container.innerHTML = '';

            data.table.rows.forEach(row => {
                const name = row.c[0]?.v;
                const worthCost = row.c[3]?.v; // Kolona "Worth shard cost" (Yes/No)
                const image = row.c[4]?.v;     // Link slike

                if (worthCost && worthCost.toString().trim().toLowerCase() === 'yes') {
                    container.innerHTML += `
                        <div class="player-card">
                            <img src="${image}" alt="${name}">
                            <div class="name">${name}</div>
                            <div class="worth-text">Worth Shard Cost</div>
                        </div>
                    `;
                }
            });

            if (container.innerHTML === '') {
                container.innerHTML = '<p style="text-align:center; color:#8b9bb4; grid-column:1/-1;">No players found with "Yes".</p>';
            }
        });
    </script>
</body>
</html>
