<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Hub</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #121824;
            --accent-green: #00ff88;
            --accent-purple: #c084fc;
            --text-main: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { 
            text-align: center !important;
            margin-top: 25px;
            margin-bottom: 50px;
            color: var(--accent-green);
            font-size: 1.5rem;
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
            margin: 0;
            padding-left: 0;
        }
        .menu-card {
            background-color: var(--card-bg);
            padding: 12px 18px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid #1a233a;
            display: inline-flex;
            align-items: center;
            font-size: 0.9rem;
            cursor: pointer;
            box-sizing: border-box;
            width: fit-content;
            min-width: 260px;
        }
        .menu-card span {
            color: var(--accent-purple);
            margin-right: 10px;
            font-size: 1rem;
        }
        .submenu-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
        }
        #eventsSubmenu {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            width: fit-content;
            padding-left: 15px;
        }
        .submenu-item {
            color: #8b9bb4;
            text-decoration: none;
            padding: 8px 14px;
            background: #161d2b;
            border-radius: 5px;
            border: 1px solid #1a233a;
            display: inline-flex;
            align-items: center;
            font-size: 0.85rem;
            min-width: 200px;
        }
        .submenu-item span {
            color: var(--accent-purple);
            margin-right: 8px;
        }
        .submenu-item:hover {
            color: #ffffff;
            border-color: var(--accent-green);
        }
    </style>
</head>
<body>

    <h1>FC Mobile Hub</h1>
    
    <div class="menu-grid">
        <a href="comparison.html" class="menu-card">
            <span>&#x2694;</span> Player Comparison
        </a>
        
        <div class="submenu-container">
            <div class="menu-card" onclick="document.getElementById('eventsSubmenu').style.display = (document.getElementById('eventsSubmenu').style.display === 'flex' ? 'none' : 'flex')">
                <span>&#x2605;</span> In-Game Events
            </div>
            
            <div id="eventsSubmenu">
                <a href="events-champions.html" class="submenu-item">
                    <span>&#x25C6;</span> Champions
                </a>
            </div>
        </div>

        <a href="activity-points.html" class="menu-card">
            <span>&#x25B6;</span> Activity points explanation
        </a>

        <a href="vsa-school.html" class="menu-card">
            <span>&#x25CE;</span> VSA school
        </a>

        <a href="lvl-rankings.html" class="menu-card">
            <span>&#x25A0;</span> LvL rankings
        </a>
    </div>

</body>
</html>
