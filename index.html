<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Hub</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #121824;
            --sub-bg: #1a2233;
            --accent-green: #00ff88;
            --text-main: #ffffff;
            --text-dim: #8b9bb4;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { 
            text-align: center; /* Naslov na sredini */
            margin-top: 10px;
            margin-bottom: 30px; 
            color: var(--accent-green);
            font-size: 1.5rem;
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 100%;
        }
        .menu-card {
            background-color: var(--card-bg);
            padding: 14px 18px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid #1a233a;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        .menu-card span {
            margin-right: 12px;
            font-size: 1.1rem;
        }
        /* Stil za podmeni (Events lista) */
        .submenu {
            display: none;
            flex-direction: column;
            gap: 8px;
            padding-left: 20px;
            margin-top: 8px;
        }
        .submenu-item {
            background-color: var(--sub-bg);
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            border: 1px solid #222d44;
        }
        .submenu-item:hover {
            color: var(--text-main);
            border-color: var(--accent-green);
        }
    </style>
</head>
<body>

    <h1>FC Mobile Hub</h1>
    
    <div class="menu-grid">
        <!-- Player Comparison -->
        <a href="comparison.html" class="menu-card">
            <span>&#x2694;</span> Player Comparison
        </a>

        <!-- In-Game Events sa podmenijem -->
        <div>
            <div class="menu-card" onclick="toggleSubmenu()">
                <span>&#x2605;</span> In-Game Events
            </div>
            <!-- Podmeni koji se otvara na klik -->
            <div id="eventsSubmenu" class="submenu">
                <a href="events-captains.html" class="submenu-item">
                    <span>&#x25B8;</span> Captains
                </a>
            </div>
        </div>
    </div>

    <script>
        function toggleSubmenu() {
            var submenu = document.getElementById("eventsSubmenu");
            if (submenu.style.display === "flex") {
                submenu.style.display = "none";
            } else {
                submenu.style.display = "flex";
            }
        }
    </script>

</body>
</html>
