<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Hub</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #121824;
            --accent-green: #00ff88;
            --text-main: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 { 
            text-align: center !important;
            margin-top: 20px;
            margin-bottom: 60px; /* Veći razmak */
            color: var(--accent-green);
            font-size: 1.5rem;
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .menu-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid #1a233a;
            display: flex;
            align-items: center;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        #eventsSubmenu {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            padding-left: 20px;
        }
        .submenu-item {
            color: #8b9bb4;
            text-decoration: none;
            padding: 10px;
            background: #161d2b;
            border-radius: 5px;
            border: 1px solid #1a233a;
        }
        .submenu-item:hover {
            color: #ffffff;
            border-color: var(--accent-green);
        }
    </style>
</head>
<body>

    <h1>FC Mobile Hub</h1>
    
    <div class="menu-grid">
        <a href="comparison.html" class="menu-card">
            <span>&#x2694;&nbsp;&nbsp;</span> Player Comparison
        </a>
        
        <div class="menu-card" onclick="document.getElementById('eventsSubmenu').style.display = (document.getElementById('eventsSubmenu').style.display === 'flex' ? 'none' : 'flex')">
            <span>&#x2605;&nbsp;&nbsp;</span> In-Game Events
        </div>
        
        <div id="eventsSubmenu">
            <a href="events-champions.html" class="submenu-item">🏆 Champions</a>
        </div>
    </div>

</body>
</html>
