<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Hub</title>
    <style>
        :root {
            --bg-color: #080b10;
            --card-bg: #111622;
            --card-hover: #171f30;
            --accent-green: #00ff88;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 255, 136, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Header sekcija poput dizajna */
        .header-container {
            text-align: left;
            width: 100%;
            max-width: 440px;
            margin-bottom: 30px;
        }

        .brand-top {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--accent-green);
            display: block;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Meni struktura */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 440px;
        }

        .menu-card, .submenu-trigger {
            background-color: var(--card-bg);
            padding: 14px 18px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            box-sizing: border-box;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .menu-card:hover, .submenu-trigger:hover, .submenu-item:hover {
            background-color: var(--card-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .menu-card span.icon, .submenu-trigger span.icon, .submenu-item span.icon {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            color: var(--text-main);
        }

        .arrow {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .menu-card:hover .arrow, .submenu-trigger:hover .arrow {
            color: var(--accent-green);
            transform: translateX(3px);
        }

        /* Podmeni stilizacija */
        .submenu-container {
            width: 100%;
        }

        #eventsSubmenu {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            padding-left: 12px;
            box-sizing: border-box;
        }

        .submenu-item {
            color: var(--text-muted);
            text-decoration: none;
            padding: 12px 16px;
            background: #0d121c;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .submenu-item:hover {
            color: #ffffff;
            border-color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="brand-top">EA SPORTS FC MOBILE</div>
        <h1>FC Mobile <span>HUB</span></h1>
        <div class="subtitle">Everything you need in one place.</div>
    </div>
    
    <div class="menu-grid">
        <a href="comparison.html" class="menu-card">
            <div class="card-left">
                <span class="icon">&#128101;</span> Player Comparison
            </div>
            <span class="arrow">&gt;</span>
        </a>
        
        <div class="submenu-container">
            <div class="submenu-trigger" onclick="toggleSubmenu()">
                <div class="card-left">
                    <span class="icon">&#128197;</span> In-Game Events
                </div>
                <span class="arrow" id="submenuArrow">&gt;</span>
            </div>
            
            <div id="eventsSubmenu">
                <a href="events-champions.html" class="submenu-item">
                    <div class="card-left">
                        <span class="icon">&#9670;</span> Champions
                    </div>
                    <span class="arrow">&gt;</span>
                </a>
            </div>
        </div>

        <a href="activity-points.html" class="menu-card">
            <div class="card-left">
                <span class="icon">&#128196;</span> Activity points explanation
            </div>
            <span class="arrow">&gt;</span>
        </a>

        <a href="vsa-school.html" class="menu-card">
            <div class="card-left">
                <span class="icon">&#128295;</span> VSA school
            </div>
            <span class="arrow">&gt;</span>
        </a>

        <a href="lvl-rankings.html" class="menu-card">
            <div class="card-left">
                <span class="icon">&#128202;</span> LvL rankings
            </div>
            <span class="arrow">&gt;</span>
        </a>
    </div>

    <script>
        function toggleSubmenu() {
            const submenu = document.getElementById('eventsSubmenu');
            const arrow = document.getElementById('submenuArrow');
            if (submenu.style.display === 'flex') {
                submenu.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            } else {
                submenu.style.display = 'flex';
                arrow.style.transform = 'rotate(90deg)';
            }
        }
    </script>

</body>
</html>
