<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Comparison</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #121824;
            --accent-green: #00ff88;
            --accent-red: #ff3366;
            --border-glow: #1a233a;
            --text-dim: #8b9bb4;
            --text-main: #ffffff;
            --input-bg: #182030;
            --row-bg: #161d2b;
            --shadow-color: rgba(0,0,0,0.8);
            --border-color: #2a374e;
        }

        [data-theme="light"] {
            --bg-color: #cbd5e1;
            --card-bg: #e2e8f0;
            --accent-green: #15803d;
            --accent-red: #b91c1c;
            --border-glow: #94a3b8;
            --text-dim: #475569;
            --text-main: #0f172a;
            --input-bg: #f1f5f9;
            --row-bg: #cbd5e1;
            --shadow-color: rgba(0,0,0,0.15);
            --border-color: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 8px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
            position: relative;
            min-height: 100vh;
        }

        .bg-logo-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            opacity: 0.04;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
        }

        .bg-logo-container svg {
            width: 100%;
            height: 100%;
            fill: var(--text-main);
        }

        .app-content {
            position: relative;
            z-index: 1;
        }

        .header-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            max-width: 900px;
            margin: 0 auto 8px auto;
            height: 35px;
        }

        h2 {
            margin: 0;
            color: var(--text-main);
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
            text-align: center;
        }

        .theme-toggle {
            position: absolute;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px var(--shadow-color);
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-dim);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .tab-btn.active {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .player-selector-group {
            width: 48%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 8px 30px 8px 8px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
            font-size: 12px;
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .search-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
        }

        .search-icon {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            pointer-events: none;
            font-size: 12px;
        }

        .dropdown-select {
            width: 100%;
            padding: 6px;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-weight: bold;
            outline: none;
            font-size: 11px;
        }

        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 8px 16px var(--shadow-color);
        }

        .dropdown-item {
            padding: 6px 8px;
            cursor: pointer;
            font-size: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            color: var(--text-main);
        }

        .dropdown-item:hover {
            background: var(--accent-green);
            color: #fff;
        }

        .dropdown-item .pos-tag {
            font-size: 10px;
            opacity: 0.8;
        }

        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            max-width: 900px;
            margin: 0 auto;
            align-items: start;
        }

        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 4px 15px var(--shadow-color);
            box-sizing: border-box;
            min-width: 0;
        }

        .player-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-sizing: border-box;
        }

        .player-top-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-img {
            width: 65px;
            height: 75px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .player-details-right {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 10px;
            color: var(--text-dim);
            font-weight: 600;
            flex-grow: 1;
        }

        .meta-line {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .player-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
            padding-top: 2px;
            border-top: 1px dashed var(--border-color);
        }

        .player-name-area {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex-grow: 1;
        }

        .player-name {
            font-size: 11px;
            font-weight: bold;
            color: var(--text-main);
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pros-cons-btn {
            background: none;
            border: none;
            color: var(--accent-green);
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            text-align: left;
            text-decoration: underline;
            width: fit-content;
        }

        .pros-cons-btn:hover {
            opacity: 0.8;
        }

        .shard-inline {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: #38bdf8;
            font-weight: 700;
            font-size: 10px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .shard-inline svg {
            vertical-align: middle;
        }

        .stat-group {
            margin-bottom: 8px;
            background: var(--input-bg);
            padding: 4px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
        }

        .group-title {
            font-size: 9px;
            font-weight: bold;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            padding-left: 2px;
        }

        .main-stats-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1px;
            text-align: center;
        }

        .stat-box-main {
            display: flex;
            flex-direction: column;
            padding: 2px 0px;
            border-radius: 3px;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }

        .stat-box-main .lbl {
            font-size: 6.5px;
            color: var(--text-dim);
            font-weight: bold;
            margin-bottom: 1px;
            white-space: nowrap;
        }

        .stat-box-main .val {
            font-size: 9px;
            font-weight: bold;
            padding: 1px 2px;
            border-radius: 2px;
            white-space: nowrap;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--row-bg);
            padding: 3px 5px;
            border-radius: 3px;
            margin-bottom: 2px;
            font-size: 10px;
            height: 22px;
            box-sizing: border-box;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-row .name {
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 2px;
        }

        .stat-row .val-box {
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .better {
            background: rgba(46, 204, 113, 0.18);
            color: #ffffff !important;
            border: 1px solid rgba(46, 204, 113, 0.4);
        }

        .worse {
            background: rgba(231, 76, 60, 0.18);
            color: #ffffff !important;
            border: 1px solid rgba(231, 76, 60, 0.4);
        }

        [data-theme="light"] .better {
            background: rgba(22, 163, 74, 0.22);
            color: #0f172a !important;
            border: 1px solid rgba(22, 163, 74, 0.45);
        }

        [data-theme="light"] .worse {
            background: rgba(220, 38, 38, 0.22);
            color: #0f172a !important;
            border: 1px solid rgba(220, 38, 38, 0.45);
        }

        .equal {
            background: var(--border-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        /* POPUP MODAL STILOVI */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            padding: 16px;
            box-shadow: 0 10px 30px var(--shadow-color);
            position: relative;
            box-sizing: border-box;
            animation: modalFadeIn 0.2s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            padding-right: 20px;
        }

        .modal-section-title {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .modal-section-title.pros { color: var(--accent-green); }
        .modal-section-title.cons { color: var(--accent-red); }

        .modal-list {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modal-list li {
            font-size: 11px;
            color: var(--text-main);
            display: flex;
            align-items: flex-start;
            gap: 6px;
            line-height: 1.3;
        }

        .modal-list.pros-list li::before {
            content: "+";
            color: var(--accent-green);
            font-weight: bold;
            font-size: 13px;
            line-height: 1;
        }

        .modal-list.cons-list li::before {
            content: "-";
            color: var(--accent-red);
            font-weight: bold;
            font-size: 13px;
            line-height: 1;
        }

        .modal-worth-box {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .worth-yes {
            color: var(--accent-green);
            font-weight: bold;
        }

        .worth-no {
            color: var(--accent-red);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="bg-logo-container">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>

    <div class="app-content">
        <div class="header-container">
            <h2>Player Comparison</h2>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeIcon">☀️</button>
        </div>

        <div class="tabs">
            <button class="tab-btn" id="btn-DEF" onclick="switchTab('DEF', this)">DEF</button>
            <button class="tab-btn" id="btn-MID" onclick="switchTab('MID', this)">MID</button>
            <button class="tab-btn" id="btn-ATT" onclick="switchTab('ATT', this)">ATT</button>
        </div>

        <div class="controls">
            <div class="player-selector-group">
                <div class="search-box">
                    <input type="text" id="p1Input" class="search-input" placeholder="Player 1..." oninput="filterPlayers(1)" onfocus="showList(1)">
                    <span class="search-icon">&#128269;</span>
                    <div id="p1List" class="dropdown-list"></div>
                </div>
                <select id="p1Select" class="dropdown-select" onchange="onSelectChange(1)"></select>
            </div>

            <div class="player-selector-group">
                <div class="search-box">
                    <input type="text" id="p2Input" class="search-input" placeholder="Player 2..." oninput="filterPlayers(2)" onfocus="showList(2)">
                    <span class="search-icon">&#128269;</span>
                    <div id="p2List" class="dropdown-list"></div>
                </div>
                <select id="p2Select" class="dropdown-select" onchange="onSelectChange(2)"></select>
            </div>
        </div>

        <div class="compare-grid">
            <div class="player-card" id="card1"></div>
            <div class="player-card" id="card2"></div>
        </div>
    </div>

    <!-- POPUP MODAL -->
    <div class="modal-overlay" id="infoModal" onclick="closeModalOnBg(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-title" id="modalPlayerTitle">Player Info</div>
            
            <div class="modal-section-title pros">Pros</div>
            <ul class="modal-list pros-list" id="modalProsList"></ul>

            <div class="modal-section-title cons">Cons</div>
            <ul class="modal-list cons-list" id="modalConsList"></ul>

            <div class="modal-worth-box">
                <span>Worth the shard cost:</span>
                <span id="modalWorthVal">-</span>
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '14GJlmnduoo0s8-p5olA1qzmX6a0ylmoVBTshTxeEA3A';
        
        let currentTab = localStorage.getItem('fc_comparison_tab') || 'DEF';
        let playersData = [];
        let headers = [];

        let selectedP1Idx = 0;
        let selectedP2Idx = 1;

        const statGroups = [
            { name: "Pace", keys: ["Acceleration", "Sprint speed"] },
            { name: "Shooting", keys: ["Finishing", "Shot power", "Long shots", "Positioning", "Volleys", "Penalties"] },
            { name: "Passing", keys: ["Short passing", "Long passing", "Vision", "Crossing", "Curve", "Free kick"] },
            { name: "Dribbling", keys: ["Dribbling", "Agility", "Balance", "Reactions", "Ball control"] },
            { name: "Defending", keys: ["Marking", "Standing tackle", "Sliding tackle", "Awareness", "Heading", "Interceptions"] },
            { name: "Physical", keys: ["Strength", "Aggression", "Jumping", "Stamina"] }
        ];

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const iconBtn = document.getElementById('themeIcon');

            if (currentTheme === 'light') {
                document.documentElement.setAttribute('data-theme', 'dark');
                iconBtn.textContent = '☀️';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                iconBtn.textContent = '🌙';
            }
        }

        function getProp(obj, keys) {
            for (let k of keys) {
                let foundKey = Object.keys(obj).find(key => key.toLowerCase().trim() === k.toLowerCase().trim());
                if (foundKey && obj[foundKey] !== undefined && obj[foundKey] !== '') return obj[foundKey];
            }
            return '-';
        }

        async function switchTab(tabName, btn) {
            currentTab = tabName;
            localStorage.setItem('fc_comparison_tab', tabName);

            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) {
                btn.classList.add('active');
            } else {
                const targetBtn = document.getElementById(`btn-${tabName}`);
                if (targetBtn) targetBtn.classList.add('active');
            }

            selectedP1Idx = 0;
            selectedP2Idx = 1;
            await loadSheetData();
        }

        async function loadSheetData() {
            try {
                const JSON_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${currentTab}`;
                const res = await fetch(JSON_URL);
                const text = await res.text();
                const json = JSON.parse(text.substr(47).slice(0, -2));

                headers = json.table.cols.map(col => col ? col.label : '');
                playersData = json.table.rows.map(row => {
                    let player = {};
                    row.c.forEach((cell, idx) => {
                        if (headers[idx]) {
                            player[headers[idx]] = cell ? (cell.v !== null ? cell.v : '') : '';
                        }
                    });
                    return player;
                });

                if (playersData.length > 0) {
                    if (selectedP1Idx >= playersData.length) selectedP1Idx = 0;
                    if (selectedP2Idx >= playersData.length) selectedP2Idx = playersData.length > 1 ? 1 : 0;
                    
                    populateNativeSelects();
                    syncSelectors(1);
                    syncSelectors(2);
                    renderComparison();
                }
            } catch (err) {
                console.error("Error loading data:", err);
            }
        }

        function populateNativeSelects() {
            const s1 = document.getElementById('p1Select');
            const s2 = document.getElementById('p2Select');
            s1.innerHTML = '';
            s2.innerHTML = '';

            playersData.forEach((player, idx) => {
                const name = getProp(player, ['Name', 'Ime']);
                const ovr = getProp(player, ['Ovr', 'OVR']);
                const optText = `${ovr} | ${name}`;

                s1.options.add(new Option(optText, idx));
                s2.options.add(new Option(optText, idx));
            });

            s1.value = selectedP1Idx;
            s2.value = selectedP2Idx;
        }

        function onSelectChange(slot) {
            const selectEl = document.getElementById(`p${slot}Select`);
            const idx = parseInt(selectEl.value, 10);
            selectPlayer(slot, idx);
        }

        function syncSelectors(slot) {
            const idx = slot === 1 ? selectedP1Idx : selectedP2Idx;
            const input = document.getElementById(`p${slot}Input`);
            const selectEl = document.getElementById(`p${slot}Select`);

            input.value = '';
            if (playersData[idx]) {
                selectEl.value = idx;
            }
        }

        function filterPlayers(slot) {
            const query = document.getElementById(`p${slot}Input`).value.toLowerCase();
            const listDiv = document.getElementById(`p${slot}List`);
            listDiv.innerHTML = '';

            if (query.trim() === '') {
                listDiv.style.display = 'none';
                return;
            }

            listDiv.style.display = 'block';

            playersData.forEach((player, idx) => {
                const name = getProp(player, ['Name', 'Ime']);
                const ovr = getProp(player, ['Ovr', 'OVR']);
                const pos = getProp(player, ['Pos']);
                const fullText = `${ovr} ${name} ${pos}`.toLowerCase();

                if (fullText.includes(query)) {
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';
                    item.innerHTML = `<span><strong>${ovr}</strong> ${name}</span> <span class="pos-tag">${pos}</span>`;
                    item.onclick = () => selectPlayer(slot, idx);
                    listDiv.appendChild(item);
                }
            });
        }

        function showList(slot) {
            if (document.getElementById(`p${slot}Input`).value.trim() !== '') {
                filterPlayers(slot);
            }
        }

        function selectPlayer(slot, idx) {
            if (slot === 1) {
                selectedP1Idx = idx;
            } else {
                selectedP2Idx = idx;
            }
            syncSelectors(slot);
            document.getElementById(`p${slot}List`).style.display = 'none';
            renderComparison();
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-box')) {
                document.getElementById('p1List').style.display = 'none';
                document.getElementById('p2List').style.display = 'none';
            }
        });

        function renderComparison() {
            if (!playersData[selectedP1Idx] || !playersData[selectedP2Idx]) return;

            const p1 = playersData[selectedP1Idx];
            const p2 = playersData[selectedP2Idx];

            document.getElementById('card1').innerHTML = buildCardHTML(p1, p2);
            document.getElementById('card2').innerHTML = buildCardHTML(p2, p1);
        }

        function buildCardHTML(player, opponent) {
            const name = getProp(player, ['Name', 'Ime']);
            const ovr = getProp(player, ['Ovr', 'OVR']);
            const pos = getProp(player, ['Pos']);
            
            const altPos = getProp(player, ['Alt Pos', 'Alt Position', 'Alternative Position', 'AltPos']);
            const wf = getProp(player, ['WF', 'Weak Foot']);
            const sm = getProp(player, ['SM', 'Skill Moves']);
            const height = getProp(player, ['Height', 'Visina', 'Ht']);
            const imgUrl = getProp(player, ['Image', 'Img']);
            const shardCost = getProp(player, ['Shard cost', 'Shard Cost', 'ShardCost', 'Shards']);

            let imgHTML = imgUrl !== '-' ? `<img src="${imgUrl}" class="player-img" alt="${name}" />` : '';
            let altPosText = (altPos !== '-' && altPos !== '') ? `Alt: ${altPos}` : '';
            let heightText = (height !== '-' && height !== '') ? `${height}` : '';

            let shardHTML = '';
            if (shardCost !== '-' && shardCost !== '') {
                const formattedCost = typeof shardCost === 'number' ? shardCost.toLocaleString() : shardCost;
                shardHTML = `<span class="shard-inline"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.43 12.98c.04-.32.07-.64.07-.98 0-.34-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46.21 14.25 0 14 0h-4c-.25 0-.46.21-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98 0 .33.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.22.24.42.49.42h4c.25 0 .46-.21.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65z"/><circle cx="12" cy="12" r="3"/></svg>${formattedCost}</span>`;
            }

            let html = `
                <div class="player-header">
                    <div class="player-top-row">
                        ${imgHTML}
                        <div class="player-details-right">
                            <div class="meta-line">WF: ${wf}★</div>
                            <div class="meta-line">SM: ${sm}★</div>
                            ${heightText ? `<div class="meta-line">Height: ${heightText}</div>` : ''}
                            ${altPosText ? `<div class="meta-line">${altPosText}</div>` : ''}
                        </div>
                    </div>
                    <div class="player-bottom-row">
                        <div class="player-name-area">
                            <div class="player-name">${ovr} | ${name} (${pos !== '-' ? pos : ''})</div>
                            <button class="pros-cons-btn" onclick="openModal('${selectedP1Idx === playersData.indexOf(player) ? 'p1' : 'p2'}', '${name.replace(/'/g, "\\'")}')">Pros & Cons</button>
                        </div>
                        ${shardHTML}
                    </div>
                </div>
            `;

            html += `
                <div class="stat-group">
                    <div class="group-title">Overview</div>
                    <div class="main-stats-grid">
            `;

            ['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY'].forEach(key => {
                const val1Raw = getProp(player, [key]);
                const val2Raw = getProp(opponent, [key]);

                const val1 = parseFloat(val1Raw) || 0;
                const val2 = parseFloat(val2Raw) || 0;
                
                let cls = '';
                if (val1 > val2) cls = 'better';
                else if (val1 < val2) cls = 'worse';

                html += `
                    <div class="stat-box-main">
                        <span class="lbl">${key}</span>
                        <span class="val ${cls}">${val1Raw}</span>
                    </div>
                `;
            });

            html += `
                    </div>
                </div>
            `;

            statGroups.forEach(group => {
                let groupRowsHTML = '';

                group.keys.forEach(key => {
                    const matchedHeader = headers.find(h => h && h.trim().toLowerCase() === key.toLowerCase());

                    if (matchedHeader) {
                        const val1 = player[matchedHeader];
                        const val2 = opponent[matchedHeader];

                        const hasVal1 = val1 !== undefined && val1 !== '';
                        const hasVal2 = val2 !== undefined && val2 !== '';

                        if (hasVal1 || hasVal2) {
                            const num1 = parseFloat(val1);
                            const num2 = parseFloat(val2);

                            let cls = 'equal';
                            if (hasVal1 && hasVal2 && !isNaN(num1) && !isNaN(num2)) {
                                if (num1 > num2) cls = 'better';
                                else if (num1 < num2) cls = 'worse';
                            } else if (hasVal1 && !hasVal2) {
                                cls = 'better';
                            } else if (!hasVal1 && hasVal2) {
                                cls = 'worse';
                            }

                            groupRowsHTML += `
                                <div class="stat-row">
                                    <span class="name">${key}</span>
                                    <span class="val-box ${cls}">${hasVal1 ? val1 : '-'}</span>
                                </div>
                            `;
                        }
                    }
                });

                if (groupRowsHTML !== '') {
                    html += `
                        <div class="stat-group">
                            <div class="group-title">${group.name}</div>
                            ${groupRowsHTML}
                        </div>
                    `;
                }
            });

            return html;
        }

        function openModal(cardType, playerName) {
            const modal = document.getElementById('infoModal');
            const titleEl = document.getElementById('modalPlayerTitle');
            const prosListEl = document.getElementById('modalProsList');
            const consListEl = document.getElementById('modalConsList');
            const worthValEl = document.getElementById('modalWorthVal');

            const playerIdx = (cardType === 'p1') ? selectedP1Idx : selectedP2Idx;
            const player = playersData[playerIdx];

            titleEl.textContent = playerName + ' - Review';
            prosListEl.innerHTML = '';
            consListEl.innerHTML = '';
            worthValEl.textContent = '-';
            worthValEl.className = '';

            if (player) {
                const prosVal = getProp(player, ['Pros', 'Prednosti']);
                const consVal = getProp(player, ['Cons', 'Mane']);
                const worthVal = getProp(player, ['Worth shard cost', 'Worth Shard Cost', 'Shard Cost', 'Worth']);

                if (prosVal && prosVal !== '-') {
                    prosVal.split(',').forEach(item => {
                        const trimmed = item.trim();
                        if (trimmed) {
                            const li = document.createElement('li');
                            li.textContent = trimmed;
                            prosListEl.appendChild(li);
                        }
                    });
                }

                if (consVal && consVal !== '-') {
                    consVal.split(',').forEach(item => {
                        const trimmed = item.trim();
                        if (trimmed) {
                            const li = document.createElement('li');
                            li.textContent = trimmed;
                            consListEl.appendChild(li);
                        }
                    });
                }

                if (worthVal && worthVal !== '-') {
                    worthValEl.textContent = worthVal;
                    if (worthVal.toLowerCase() === 'yes') worthValEl.className = 'worth-yes';
                    else if (worthVal.toLowerCase() === 'no') worthValEl.className = 'worth-no';
                }
            }

            if (prosListEl.children.length === 0) {
                const li = document.createElement('li');
                li.textContent = 'No data available.';
                prosListEl.appendChild(li);
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }

        function closeModalOnBg(e) {
            if (e.target.id === 'infoModal') {
                closeModal();
            }
        }

        switchTab(currentTab, null);
    </script>
</body>
</html>
