<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Community Hub</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #121824;
            --accent-green: #00ff88;
            --accent-blue: #3388ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: sans-serif; 
            padding: 20px; 
            margin: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { 
            color: var(--accent-green); 
            text-align: center; 
            font-size: 1.5rem; 
            margin-bottom: 5px; 
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .menu-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 5px;
            padding-left: 5px;
        }

        .menu-card {
            background: var(--card-bg);
            border: 1px solid #1a233a;
            padding: 15px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: bold;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .menu-card:hover {
            border-color: var(--accent-blue);
            background: #172136;
        }

        .menu-card span {
            color: var(--accent-blue);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>FC Mobile Hub</h1>
    <p class="subtitle">Community Dashboard & Tools</p>

    <div class="menu-container">
        
        <div class="menu-section-title">In-Game Events</div>
        
        <!-- Ovde je dodat Champions sa unikatnim simbolom -->
        <a href="events-champions.html" class="menu-card">
            🏆 Champions
            <span>&#8594;</span>
        </a>

        <!-- Dodaj ostale evente ili stranice po potrebi ispod na isti način -->
        
    </div>

</body>
</html>
