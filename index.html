<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA Sports FC Mobile - Player Comparison</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        button {
            background-color: #1f8ef1;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }
        button:hover {
            background-color: #0b70cd;
        }
        .popup {
            background-color: #1e1e1e;
            border: 1px solid #333;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Player Comparison</h1>
        <button onclick="loadData()">Učitaj podatke</button>
        
        <div id="result" class="popup" style="display:none;">
            <h3 id="player-name">Hagi</h3>
            <p><strong>PROS:</strong> <span id="player-pros">No data available.</span></p>
            <p><strong>CONS:</strong> <span id="player-cons">No data available.</span></p>
            <p><strong>Worth the shard cost:</strong> <span id="player-shard">-</span></p>
        </div>
    </div>

    <script>
        const SHEET_ID = 'Tvoj_Sheet_ID_Ode'; // Ovde ide ID tvoje tabele
        let infoDataMap = {};

        function getProp(obj, keys) {
            for (let key of keys) {
                if (obj[key] !== undefined) return obj[key];
            }
            return '';
        }

        async function loadInfoSheet() {
            infoDataMap = {};
            try {
                // Prvo pokušavamo sa eksplicitnim nazivom Info
                let infoRes = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Info`);
                let text = await infoRes.text();
                
                // Ako tab nije nađen po imenu ili vrati grešku, preuzimamo prvi tab automatski
                if (text.includes("error") || text.length < 50) {
                    infoRes = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`);
                    text = await infoRes.text();
                }

                const json = JSON.parse(text.substr(47).slice(0, -2));
                const infoHeaders = json.table.cols.map(col => col ? col.label : '');
                
                json.table.rows.forEach(row => {
                    let infoRow = {};
                    row.c.forEach((cell, idx) => {
                        if (infoHeaders[idx]) {
                            infoRow[infoHeaders[idx]] = cell ? (cell.v !== null ? cell.v : '') : '';
                        }
                    });
                    const nameKey = getProp(infoRow, ['Name', 'Ime']).trim().toLowerCase();
                    if (nameKey && nameKey !== '-') {
                        infoDataMap[nameKey] = infoRow;
                    }
                });

                // Primer popunjavanja za Hagija nakon učitavanja
                const hagiData = infoDataMap['hagi'];
                if (hagiData) {
                    document.getElementById('player-pros').innerText = getProp(hagiData, ['Pros']) || 'No data available.';
                    document.getElementById('player-cons').innerText = getProp(hagiData, ['Cons']) || 'No data available.';
                    document.getElementById('player-shard').innerText = getProp(hagiData, ['Worth shard cost']) || '-';
                }
                
                document.getElementById('result').style.display = 'block';
            } catch (e) {
                console.log("Error loading info sheet:", e);
            }
        }

        function loadData() {
            loadInfoSheet();
        }
    </script>
</body>
</html>
