<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Mobile Hub</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #121824;
            --accent-green: #00ff88;
            --text-main: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: block; /* Uklonjeno flex centriranje */
        }
        h1 { 
            text-align: left; /* Naslov na levo */
            margin-top: 10px;
            margin-bottom: 30px; 
            color: var(--accent-green);
            font-size: 1.5rem;
        }
        .menu-grid {
            display: grid;
            gap: 15px;
            width: 100%; /* Uzima punu širinu */
        }
        .menu-card {
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid #1a233a;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Poravnanje sadržaja levo */
            font-size: 1rem;
            font-weight: 500;
        }
        .menu-card span {
            margin-right: 12px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <h1>FC Mobile Hub</h1>
    
    <div class="menu-grid">
        <a href="comparison.html" class="menu-card">
            <span>&#x2694;</span> Player Comparison
        </a>
        <a href="events.html" class="menu-card">
            <span>&#x2605;</span> In-Game Events
        </a>
    </div>

</body>
</html>
